name: PlatformIO Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Prepare CI credentials
        run: cp include/config/LocalCredentials.example.h include/config/LocalCredentials.h

      - name: Build firmware
        run: platformio run -e esp32-c3-supermini
