[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

# Remove the Arduino/ESP32 framework's default -std=gnu++11 so that our
# -std=gnu++17 flag below takes effect without conflicting with it.
build_unflags = -std=gnu++11

build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
